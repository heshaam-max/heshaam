<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HESHAAM PROFILE HUB</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #17153a 50%, #090d16 100%);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body.light-theme {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f8fafc 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; cursor: none !important; }
    #cursor-spotlight { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(99, 102, 241, 0.15), transparent 40%); transition: opacity 0.3s ease; }
    #cursor-dot { position: fixed; top: 0; left: 0; width: 6px; height: 6px; background: #ffffff; border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%, -50%); box-shadow: 0 0 10px #ffffff, 0 0 20px var(--accent); }
    #cursor-ring { position: fixed; top: 0; left: 0; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid rgba(99, 102, 241, 0.8); background: rgba(99, 102, 241, 0.05); box-shadow: 0 0 15px rgba(99, 102, 241, 0.4), inset 0 0 15px rgba(236, 72, 153, 0.2); pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), height 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease; }
    body.cursor-hover #cursor-ring { width: 58px; height: 58px; border-color: #ec4899; background: rgba(236, 72, 153, 0.12); box-shadow: 0 0 25px rgba(236, 72, 153, 0.6), inset 0 0 20px rgba(99, 102, 241, 0.4); }
    .trail-spark { position: fixed; width: 5px; height: 5px; border-radius: 50%; pointer-events: none; z-index: 9998; animation: fadeOutSpark 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    @keyframes fadeOutSpark { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.1) translateY(12px); } }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; overflow-x: hidden; transition: background 0.4s ease; }
    body::before, body::after { content: ''; position: absolute; width: 300px; height: 300px; background: var(--accent); filter: blur(150px); border-radius: 50%; opacity: 0.18; z-index: 0; pointer-events: none; }
    body::before { top: 5%; left: 20%; }
    body::after { bottom: 5%; right: 20%; background: #ec4899; }
    .profile-card { position: relative; z-index: 1; width: 100%; max-width: 440px; background: var(--card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--card-border); border-radius: 28px; padding: 30px 26px; text-align: center; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25); }
    .dynamic-island { position: relative; margin: 0 auto 16px auto; width: 100%; max-width: 230px; min-height: 34px; background: #000000; border-radius: 20px; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 12px; color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); }
    .top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .theme-toggle, .visitor-badge { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .logo-wrapper { position: relative; display: inline-block; margin-bottom: 14px; }
    .logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255, 255, 255, 0.15); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .profile-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .bio-wrapper { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 16px; }
    .profile-bio { color: var(--text-muted); font-size: 0.88rem; line-height: 1.4; }
    .bio-copy-btn { background: none; border: none; color: var(--text-muted); font-size: 0.8rem; }
    .reactions-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .reaction-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); padding: 6px 10px; border-radius: 12px; color: var(--text-main); font-size: 0.82rem; display: flex; align-items: center; gap: 5px; }
    .links-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; max-height: 200px; overflow-y: auto; padding-right: 4px; }
    .link-card { display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); padding: 13px 18px; border-radius: 14px; color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 0.92rem; transition: all 0.3s; }
    .link-card:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .note-box { background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--card-border); padding: 14px; border-radius: 16px; margin-bottom: 16px; text-align: left; }
    .note-box textarea { width: 100%; background: rgba(9, 13, 22, 0.6); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; color: #fff; font-size: 0.85rem; resize: none; outline: none; height: 55px; margin-bottom: 8px; }
    .note-btn { width: 100%; padding: 8px; background: rgba(99, 102, 241, 0.2); border: 1px solid var(--accent); color: #fff; font-weight: 600; border-radius: 8px; }
    .actions-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
    .action-btn { padding: 10px 4px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-main); font-size: 0.72rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; }
    .admin-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.8rem; text-decoration: none; padding: 6px 14px; border-radius: 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal { background: #131b2e; border: 1px solid var(--card-border); padding: 36px 28px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; }
    .modal input { width: 100%; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(9, 13, 22, 0.8); color: #fff; font-size: 1rem; outline: none; margin-bottom: 16px; }
    .modal button { width: 100%; padding: 14px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-weight: 600; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="cursor-spotlight"></div>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <div class="profile-card">
    <div class="dynamic-island" id="dynamicIsland">
      <div style="font-size: 0.75px; font-weight: 600;" id="islandText">Heshaam Hub • Online</div>
    </div>

    <div class="top-controls">
      <div class="visitor-badge">
        <i class="fa-solid fa-eye"></i> Views: <span id="viewCountVal">--</span>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">
        <i class="fa-solid fa-moon" id="themeIcon"></i> Theme
      </button>
    </div>

    <div class="logo-wrapper">
      <img id="profileLogo" class="logo" src="https://via.placeholder.com/110" alt="Profile Logo" />
    </div>
    <h1 class="profile-title" id="welcomeHeading">Connect With Heshaam</h1>

    <div class="bio-wrapper">
      <p class="profile-bio" id="profileBio">Official social links & channels hub</p>
      <button class="bio-copy-btn" onclick="copyBioText()"><i class="fa-regular fa-copy"></i></button>
    </div>

    <div class="reactions-bar">
      <button class="reaction-btn" onclick="sendReaction('fire')">🔥 <span id="count-fire">0</span></button>
      <button class="reaction-btn" onclick="sendReaction('heart')">❤️ <span id="count-heart">0</span></button>
      <button class="reaction-btn" onclick="sendReaction('rocket')">🚀 <span id="count-rocket">0</span></button>
      <button class="reaction-btn" onclick="sendReaction('mindblown')">🤯 <span id="count-mindblown">0</span></button>
    </div>

    <div id="linksList" class="links-container"></div>

    <div class="note-box">
      <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;">
        <i class="fa-solid fa-envelope-open-text"></i> Leave a Secret Note for Heshaam:
      </div>
      <textarea id="secretNoteInput" placeholder="Write something nice..." maxlength="150"></textarea>
      <button class="note-btn" onclick="submitSecretNote()">Send Note 🤫</button>
    </div>

    <div class="actions-row">
      <button class="action-btn" onclick="openSecretPrompt()">
        <i class="fa-solid fa-lock"></i> Secret
      </button>
      <button class="action-btn" onclick="shareProfile()">
        <i class="fa-solid fa-share-nodes"></i> Share
      </button>
      <button class="action-btn" onclick="promptNameChange()">
        <i class="fa-solid fa-user-pen"></i> Edit Name
      </button>
    </div>

    <a class='admin-link' href='adminpanel.html'>
      <i class="fa-solid fa-gear"></i> Admin Dashboard
    </a>
  </div>

  <!-- Visitor Name Modal -->
  <div id="nameModal" class="modal-overlay">
    <div class="modal">
      <h2>Welcome 👋</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 16px;">Please enter your name:</p>
      <input type="text" id="visitorNameInput" placeholder="Your Name..." autocomplete="off" />
      <button onclick="submitVisitorInfo()">Continue</button>
    </div>
  </div>

  <!-- Secret Password Modal -->
  <div id="secretPasswordModal" class="modal-overlay hidden">
    <div class="modal">
      <h2>🔐 Secret Access</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 16px;">Enter secret password:</p>
      <input type="password" id="secretPasswordInput" placeholder="Password..." />
      <button onclick="checkSecretPassword()">Unlock</button>
    </div>
  </div>

  <!-- Secret Success Modal -->
  <div id="secretSuccessModal" class="modal-overlay hidden">
    <div class="modal">
      <h2>💌 Special Message</h2>
      <p id="secretSuccessTextMessage" style="color: #f1f5f9; margin: 15px 0;">Loading message...</p>
      <button onclick="document.getElementById('secretSuccessModal').classList.add('hidden')">Close</button>
    </div>
  </div>

  <script>
    const dot = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    const spotlight = document.getElementById('cursor-spotlight');

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let ringX = mouseX;
    let ringY = mouseY;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      dot.style.left = mouseX + 'px';
      dot.style.top = mouseY + 'px';
      spotlight.style.setProperty('--mouse-x', mouseX + 'px');
      spotlight.style.setProperty('--mouse-y', mouseY + 'px');
    });

    function animateCursor() {
      ringX += (mouseX - ringX) * 0.18;
      ringY += (mouseY - ringY) * 0.18;
      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    const firebaseConfig = {
      apiKey: "AIzaSyACVwVXRB_5nTFozs0PV22zd6wSpZuBVqE",
      authDomain: "reakweb.firebaseapp.com",
      databaseURL: "https://reakweb-default-rtdb.firebaseio.com",
      projectId: "reakweb",
      storageBucket: "reakweb.firebasestorage.app",
      messagingSenderId: "228639861953",
      appId: "1:228639861953:web:2941663bb550703b61b840"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // HESHAAM'S SEPARATE DATABASE COLLECTION
    const HESHAAM_DOC = db.collection('heshaam').doc('profile_data');

    window.visitorIpData = { ip: "Unavailable", country: "Unknown", region: "Unknown" };
    async function fetchGlobalIpInfo() {
      try {
        const res = await fetch("https://ipwho.is/");
        const data = await res.json();
        if (data && data.success) {
          window.visitorIpData.ip = data.ip;
          window.visitorIpData.country = data.country;
          window.visitorIpData.region = data.region;
        }
      } catch (e) {}
    }
    fetchGlobalIpInfo();

    document.addEventListener("DOMContentLoaded", () => {
      const savedName = localStorage.getItem('heshaam_visitorName');
      if (savedName) {
        document.getElementById('nameModal').classList.add('hidden');
        document.getElementById('welcomeHeading').innerText = `Welcome, ${savedName}! 👋`;
      }
      loadProfileData();
    });

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      document.getElementById('themeIcon').className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    async function submitVisitorInfo() {
      const val = document.getElementById('visitorNameInput').value.trim();
      if (!val) return alert("Please enter your name.");
      localStorage.setItem('heshaam_visitorName', val);
      document.getElementById('nameModal').classList.add('hidden');
      document.getElementById('welcomeHeading').innerText = `Welcome, ${val}! 👋`;

      try {
        await db.collection('heshaam').doc('subfolders').collection('visitors_logs').add({
          visitorName: val,
          ip: window.visitorIpData.ip,
          country: window.visitorIpData.country,
          region: window.visitorIpData.region,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          time: new Date().toLocaleString()
        });
      } catch (e) {}
    }

    async function submitSecretNote() {
      const note = document.getElementById('secretNoteInput').value.trim();
      const name = localStorage.getItem('heshaam_visitorName') || "Stranger";
      if (!note) return alert("Write something first!");

      try {
        await db.collection('heshaam').doc('subfolders').collection('visitors_notes').add({
          sender: name,
          note: note,
          ip: window.visitorIpData.ip,
          country: window.visitorIpData.country,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          time: new Date().toLocaleString()
        });
        document.getElementById('secretNoteInput').value = '';
        alert("Note sent to Heshaam successfully! 🤫");
      } catch (e) {
        alert("Error sending note.");
      }
    }

    function loadProfileData() {
      HESHAAM_DOC.onSnapshot((doc) => {
        if (doc.exists) {
          const data = doc.data();
          if (data.logo) document.getElementById('profileLogo').src = data.logo;
          if (data.bio) document.getElementById('profileBio').innerText = data.bio;
          if (data.views) document.getElementById('viewCountVal').innerText = data.views;

          // Render Links
          const linksContainer = document.getElementById('linksList');
          linksContainer.innerHTML = '';
          const links = data.links || [];
          links.forEach(l => {
            const a = document.createElement('a');
            a.className = 'link-card';
            a.href = l.url;
            a.target = '_blank';
            a.innerHTML = `<i class="fa-solid fa-link"></i> ${l.title}`;
            linksContainer.appendChild(a);
          });
        }
      });
    }

    function openSecretPrompt() {
      document.getElementById('secretPasswordModal').classList.remove('hidden');
    }

    function checkSecretPassword() {
      const pwd = document.getElementById('secretPasswordInput').value.trim();
      HESHAAM_DOC.get().then((doc) => {
        const secretPass = doc.exists && doc.data().secretPassword ? doc.data().secretPassword : 'heshaamaug';
        const secretMsg = doc.exists && doc.data().secretMessage ? doc.data().secretMessage : 'Special message from Heshaam!';
        if (pwd === secretPass) {
          document.getElementById('secretPasswordModal').classList.add('hidden');
          document.getElementById('secretSuccessTextMessage').innerText = secretMsg;
          document.getElementById('secretSuccessModal').classList.remove('hidden');
          if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70 });
        } else {
          alert("Incorrect password!");
        }
      });
    }

    async function sendReaction(type) {
      try {
        await db.runTransaction(async (t) => {
          const doc = await t.get(HESHAAM_DOC);
          const current = doc.exists && doc.data()[type] ? doc.data()[type] + 1 : 1;
          t.set(HESHAAM_DOC, { [type]: current }, { merge: true });
        });
      } catch (e) {}
    }

    HESHAAM_DOC.onSnapshot((doc) => {
      if (doc.exists) {
        const data = doc.data();
        ['fire', 'heart', 'rocket', 'mindblown'].forEach(t => {
          const span = document.getElementById(`count-${t}`);
          if (span) span.innerText = data[t] || 0;
        });
      }
    });

    function promptNameChange() {
      document.getElementById('nameModal').classList.remove('hidden');
    }

    function shareProfile() {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied!");
    }

    function copyBioText() {
      navigator.clipboard.writeText(document.getElementById('profileBio').innerText);
      alert("Bio copied!");
    }
  </script>
</body>
</html>
